<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截图 · EasyChat</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; user-select: none; cursor: crosshair; background: #101820; color: var(--color-text-primary); font: 13px var(--font-family); }
    .source { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .mask { position: absolute; inset: 0; background: #0008; pointer-events: none; }
    .selection { position: absolute; outline: 1px solid var(--color-accent); box-shadow: 0 0 0 99999px #0008; pointer-events: none; }
    [hidden] { display: none !important; }
    .size, .tool, .hint { position: absolute; padding: 8px 12px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-bg-deep); box-shadow: var(--shadow-lg); }
    .size { pointer-events: none; font-variant-numeric: tabular-nums; }
    .tool { display: flex; gap: 8px; cursor: default; }
    .hint { left: 50%; top: 24px; transform: translateX(-50%); pointer-events: none; }
    button { padding: 7px 16px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm); color: inherit; background: var(--color-surface-2); font: inherit; cursor: pointer; }
    button:hover { background: var(--color-surface-3); }
    .confirm-btn { background: var(--color-accent-soft); border-color: var(--color-border-primary); color: var(--color-accent); }
    button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <img class="source" alt="屏幕预览" draggable="false">
  <div class="mask"></div>
  <div class="selection" hidden></div>
  <div class="size" hidden></div>
  <div class="tool" hidden>
    <button class="cancel-btn">取消</button>
    <button class="confirm-btn">完成截图</button>
  </div>
  <div class="hint" role="status" aria-live="polite">正在准备截图… Esc 取消</div>
  <script src="capture.js"></script>
</body>
</html>
